      default: 1
    - name: casc_9_input
      description: Geopolitical Event input
      default: 1

  mesh:
    description: 100 sector input variables (mesh_0_input through mesh_99_input)
    count: 100
    default: 1

  independent:
    description: 1000 independent factor inputs (ind_in_0 through ind_in_999)
    count: 1000
    default_formula: "index + 1"

