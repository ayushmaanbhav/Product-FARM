    - name: chain_input
      type: decimal
      description: Base market risk input for chain propagation
      default: 0

    - name: diam_input
      type: decimal
      description: Stress factor base value
      default: 10

    - name: lat_input
      type: decimal
      description: Correlation baseline
      default: 1

    - name: tree_input
      type: decimal
      description: Enterprise risk baseline
      default: 10

  cascades:
    - name: casc_0_input
      description: Market Crash scenario input
      default: 1
    - name: casc_1_input
      description: Interest Rate Shock input
      default: 1
    - name: casc_2_input
      description: Credit Crunch input
      default: 1
    - name: casc_3_input
      description: Liquidity Crisis input
      default: 1
    - name: casc_4_input
      description: Inflation Surge input
      default: 1
    - name: casc_5_input
      description: Currency Collapse input
      default: 1
    - name: casc_6_input
